<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Kanji Lookup Tool</title>
</head>

<body>

<h1>Kanji Lookup Tool</h1>

<h2>Search a Kanji</h2>

<form id="kanji-form">
    <div class="input-group">
        <label for="kanji">Kanji:</label>
        <input id="kanji" name="kanji" type="text"/>
    </div>
    <button type="submit">Search</button>
</form>

<h2>Response:</h2>
<pre id="response"></pre>

</body>

<script> async function handleSubmit(event) {
    event.preventDefault();
    const data = new FormData(event.target);
    const value = Object.fromEntries(data.entries());
    console.log({value});

    const response = await fetch('/app/kanji', {
        method: 'POST',
        body: JSON.stringify(value),
        headers: {
            'Content-Type': 'application/json',
            }
        });
    const myJson = await response.json();
    console.log(myJson);
    document.getElementById('response').textContent = JSON.stringify(myJson, undefined, 2);
}
const form = document.getElementById("kanji-form");
form.addEventListener("submit", async (e) => handleSubmit(e), false);

</script>

</html>
